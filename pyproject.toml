[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
# Single source of truth for the release version. The CD pipeline releases
# `v<version>` when this changes on main; `marketforge.__version__` reads it
# back from the installed metadata.
version = "3.0.0"
description = "A professional-grade synthetic OHLCV data generator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "REICHHART Damien"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # numpy < 2.2 breaks the bit-exact reproducibility contract (extending the
    # range changes earlier candles by ~1e-14). The other floors are the
    # oldest releases that are binary-compatible with numpy 2. CI enforces
    # these floors with a lowest-direct resolution job.
    "numpy>=2.2",
    "numba>=0.61.2",
    "scipy>=1.13",
    "pandas>=2.2.2",
    "click>=8.1",
    "tqdm>=4.66",
    "pyarrow>=16",
    "threadpoolctl>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
marketforge = "marketforge.cli:main"

[project.urls]
Homepage = "https://github.com/DamienReichhart/MarketForge"
Documentation = "https://github.com/DamienReichhart/MarketForge#readme"
Repository = "https://github.com/DamienReichhart/MarketForge"
Issues = "https://github.com/DamienReichhart/MarketForge/issues"
Changelog = "https://github.com/DamienReichhart/MarketForge/blob/main/CHANGELOG.md"

# Development tooling (PEP 735). Not published in the package metadata.
# Install with `pip install -e . --group dev` (pip >= 25.1) or
# `uv pip install -e . --group dev`.
[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "arch>=7.0",
    "statsmodels>=0.14.2",
]
typecheck = [
    "mypy>=1.10",
]
# Pinned to a minor series: ruff's formatter output changes between minors.
lint = [
    "ruff>=0.16,<0.17",
]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    {include-group = "lint"},
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marketforge*"]

[tool.setuptools.package-data]
marketforge = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.coverage.run]
source = ["marketforge"]
branch = true

[tool.coverage.report]
# Numba-compiled kernels execute outside the Python tracer, so
# marketforge/core/kernels.py always reports low coverage.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "NPY",  # numpy-specific rules
    "PERF", # perflint
    "T20",  # no stray print()
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length is the formatter's job; long strings/URLs are fine
    "E741",   # `l` for "low" is idiomatic in OHLC code
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
".github/scripts/**" = ["T20"]
"tests/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["marketforge"]
