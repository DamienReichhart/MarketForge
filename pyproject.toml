[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
version = "2.0.0"
description = "A professional-grade synthetic OHLCV data generator"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "REICHHART Damien"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.11",
    "pandas>=2.1",
    "click>=8.1",
    "tqdm>=4.66",
    "pyarrow>=15",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "arch>=6.3",
    "statsmodels>=0.14",
]

[project.scripts]
marketforge = "marketforge.cli.parser:main"

[project.urls]
Homepage = "https://github.com/DamienReichhart/MarketForge"
Documentation = "https://github.com/DamienReichhart/MarketForge"
Repository = "https://github.com/DamienReichhart/MarketForge"

[tool.setuptools.packages.find]
where = ["."]
include = ["marketforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
