[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "marketforge"
# Single source of truth for the release version. The CD pipeline releases
# `v<version>` when this changes on main; `marketforge.__version__` reads it
# back from the installed metadata.
version = "5.0.0"
description = "Synthetic OHLCV market data for training AI trading models and testing backtesters: labelled regimes, real trading calendars, reproducible from a seed"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "REICHHART Damien"}
]
requires-python = ">=3.12"
keywords = [
    "synthetic data",
    "market data",
    "ohlcv",
    "backtesting",
    "machine learning",
    "trading",
    "quantitative finance",
    "time series",
    "regime",
    "simulation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # numpy < 2.2 breaks reproducibility within a version (extending the
    # range changes earlier candles by ~1e-14). The other floors are the
    # oldest releases that are binary-compatible with numpy 2. CI enforces
    # these floors with a lowest-direct resolution job.
    "numpy>=2.2",
    # Numba has no WebAssembly build: in Pyodide the kernels run as plain
    # Python (docs/adr/0015).
    "numba>=0.61.2; sys_platform != 'emscripten'",
    "pandas>=2.2.2",
    "click>=8.1",
    "tqdm>=4.66",
    "pyarrow>=16",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
# GeneratedData.to_polars()
polars = ["polars>=1.0"]

[project.scripts]
marketforge = "marketforge.cli.main:main"

[project.urls]
Homepage = "https://damienreichhart.github.io/MarketForge/"
Documentation = "https://damienreichhart.github.io/MarketForge/docs/"
Repository = "https://github.com/DamienReichhart/MarketForge"
Issues = "https://github.com/DamienReichhart/MarketForge/issues"
Changelog = "https://damienreichhart.github.io/MarketForge/changelog/"

# Development tooling (PEP 735). Not published in the package metadata.
# Install with `pip install -e . --group dev` (pip >= 25.1) or
# `uv pip install -e . --group dev`.
[dependency-groups]
test = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
]
typecheck = [
    "mypy>=2.4",
]
# Pinned to a minor series: ruff's formatter output changes between minors.
lint = [
    "ruff>=0.17,<0.18",
    "import-linter>=2.17",
]
# The task runner (noxfile.py) and the commit hooks (.pre-commit-config.yaml).
tools = [
    "nox>=2025.5.1",
    "pre-commit>=4.0",
]
dev = [
    {include-group = "tools"},
    {include-group = "fit"},
    {include-group = "test"},
    {include-group = "typecheck"},
    {include-group = "lint"},
]
# Refitting the catalogs' correlations (scripts/fit_correlations.py).
fit = [
    "scipy>=1.18",
]
# Used by CI/CD only (.github/workflows).
release = [
    "packaging>=26.3",
    "twine>=7.0",
    "check-wheel-contents>=0.6.3",
    "validate-pyproject[all]>=0.27",
    "cyclonedx-bom>=8.0",
]
audit = [
    "pip-audit>=2.10",
]
# What the documentation's examples import besides marketforge, so CI can run
# them (.github/scripts/doc_examples.py).
docs = [
    "scikit-learn>=1.9",
    "polars>=2.1",
    "duckdb>=2.0",
    # The Backtesting page's engine recipes.
    "backtrader>=1.9.78",
    "backtesting>=0.6.6",
    "jinja2>=3.1",  # backtesting.py's statistics
    "vectorbt>=1.2",
    "nautilus_trader>=1.231",
]
workflow-lint = [
    "actionlint-py>=1.7.12",
    "zizmor>=1.32",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["marketforge*"]

[tool.setuptools.package-data]
marketforge = ["py.typed", "config/catalog/*/fitted_correlation.json"]

# Native TOML configuration (pytest 9). `strict` turns on every strictness
# option: strict_config, strict_markers, strict_xfail and
# strict_parametrization_ids.
[tool.pytest]
minversion = "9.2"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true

[tool.coverage.run]
source = ["marketforge"]
branch = true

[tool.coverage.report]
# Numba-compiled kernels execute outside the Python tracer; they are covered
# by tests/simulation/test_kernels.py, which also runs each kernel's interpreted py_func.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "*.md"]  # keep hand-aligned README examples

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PGH",  # pygrep-hooks
    "DTZ",  # flake8-datetimez
    "NPY",  # numpy-specific rules
    "PERF", # perflint
    "T20",  # no stray print()
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line length is the formatter's job; long strings/URLs are fine
    "E741",   # `l` for "low" is idiomatic in OHLC code
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T20"]
"examples/**" = ["T20"]
"website/scripts/**" = ["T20"]
".github/scripts/**" = ["T20"]
"tests/**" = ["T20", "E731"]  # small lambda helpers read fine in tests
"noxfile.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["marketforge"]

# Architecture contract, checked in CI by `lint-imports`: a package may import
# from the ones listed below it, never from the ones above. Packages on the
# same line are independent of each other.
[tool.importlinter]
root_package = "marketforge"

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "marketforge.cli",
    "marketforge.api",
    "marketforge.aggregation | marketforge.output | marketforge.validation",
    "marketforge.simulation",
    "marketforge.config",
    "marketforge.calendars",
    "marketforge.domain",
]
