name: CI

# Quality gate for every change. Also called by the CD workflow (cd.yml) on
# main, where its `dist` artifact is the exact build that gets published.
#
# Branch protection: require the single "CI OK" check. It fails if any job
# below fails or is cancelled, so adding a job never needs a settings change.

on:
  push:
    branches: [main, dev]
  pull_request:
  merge_group:
  schedule:
    # Weekly run against the newest dependency releases and advisories, so
    # upstream breakage shows up before a user (or a release) hits it.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a workflow_call, github.workflow is the caller's name, so this never
  # collides with the CD workflow's own concurrency group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  # Newest supported Python, for the jobs that need only one interpreter.
  DEFAULT_PYTHON: "3.13"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install ruff
        run: uv pip install --group lint
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .

  typecheck:
    name: Type-check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest Python resolve different numpy releases, whose
        # type stubs differ: check both ends.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e . --group typecheck
      - name: mypy
        run: mypy marketforge

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Numba compiles natively: cover macOS (arm64) and Windows at both
          # ends of the supported Python range.
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
          # The coverage leg (extends the existing ubuntu / 3.13 entry).
          - { os: ubuntu-latest, python-version: "3.13", coverage: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e . --group test
      - name: Show environment
        run: uv pip list
      - name: pytest
        if: ${{ !matrix.coverage }}
        run: pytest
      - name: pytest (with coverage)
        if: ${{ matrix.coverage }}
        run: |
          pytest --cov --cov-report=xml --cov-report=term
          {
            echo "### Coverage"
            echo '```'
            coverage report --format=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ matrix.coverage && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  min-deps:
    name: Test (lowest supported dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.10"
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
          cache-suffix: lowest
      - name: Install the declared floors (lowest-direct resolution)
        run: uv pip install -e . --group test --resolution lowest-direct
      - name: Show environment
        run: uv pip list
      - name: pytest
        run: pytest

  build:
    name: Build & verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          # Never build a published artifact from a restored cache.
          enable-cache: "false"
      - name: Install build tools
        run: uv pip install --group release
      - name: Validate pyproject.toml
        run: validate-pyproject pyproject.toml
      - name: Build sdist, then the wheel from the sdist
        run: |
          # Reproducible archives: timestamps come from the commit.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --no-cache --out-dir dist
          ls -l dist
      - name: Check distributions
        run: |
          python .github/scripts/release.py check-dist dist
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test the wheel in a clean environment
        run: |
          expected="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          wheel="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv smoke --python "$DEFAULT_PYTHON"
          uv pip install --python smoke "$wheel"
          actual="$(smoke/bin/marketforge --version)"
          echo "$actual"
          [ "$actual" = "marketforge, version $expected" ] || { echo "::error::CLI reports '$actual', expected $expected"; exit 1; }
          smoke/bin/python - <<'PY'
          import importlib.resources
          import marketforge as mf

          assert importlib.resources.files("marketforge").joinpath("py.typed").is_file()
          data = mf.generate(["EURUSD", "BTCUSD"], start="2024-01-02", end="2024-01-04",
                             seed=1, timeframes=["H1"])
          for symbol in ("EURUSD", "BTCUSD"):
              frame = data[symbol]["H1"]
              assert len(frame) > 0, symbol
              assert (frame["high"] >= frame[["open", "close"]].max(axis=1)).all(), symbol
          print("smoke test passed:", {s: len(data[s]["H1"]) for s in data})
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install pip-audit
        run: uv pip install --group audit
      - name: Audit the runtime dependency tree (oldest and newest Python)
        run: |
          status=0
          for py in 3.10 3.14; do
            uv pip compile pyproject.toml --python-version "$py" --generate-hashes --quiet \
              -o "requirements-$py.txt"
            echo "::group::pip-audit (Python $py resolution)"
            pip-audit --strict --progress-spinner off --require-hashes --disable-pip \
              -r "requirements-$py.txt" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install linters
        run: uv pip install --group workflow-lint
      - name: actionlint
        run: actionlint -color
      - name: zizmor (Actions security audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, typecheck, test, min-deps, build, audit, workflows, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed (or be skipped)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::At least one CI job failed or was cancelled"
            exit 1
          fi
