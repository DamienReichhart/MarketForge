name: CI

# Quality gate for every change. On main it runs inside the CD workflow
# (cd.yml), where its `dist` artifact is the exact build that gets published.
#
# Branch protection: require the single "CI OK" check. It fails if any job
# below fails or is cancelled, so adding a job never needs a settings change.

on:
  push:
    # Pushes to main run this workflow from cd.yml (workflow_call), which also
    # publishes the exact `dist` it builds; a push trigger here would run it twice.
    branches: [dev]
  pull_request:
  merge_group:
  schedule:
    # Weekly run against the newest dependency releases and advisories, so
    # upstream breakage shows up before a user (or a release) hits it.
    - cron: "23 5 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a workflow_call, github.workflow is the caller's name, so this never
  # collides with the CD workflow's own concurrency group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  PY_COLORS: "1"
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  # Newest supported Python, for the jobs that need only one interpreter.
  DEFAULT_PYTHON: "3.13"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install linters
        run: uv pip install --group lint
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check --diff .
      - name: Import layers
        run: lint-imports

  typecheck:
    name: Type-check (py${{ matrix.python-version }}, numpy ${{ matrix.numpy }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # numpy's type stubs differ between releases: check the declared
        # floor (2.2) on the oldest Python and the newest numpy on the newest.
        include:
          - { python-version: "3.12", numpy: "2.2.*" }
          - { python-version: "3.14", numpy: "latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Install
        env:
          NUMPY: ${{ matrix.numpy }}
        run: |
          if [ "$NUMPY" = latest ]; then
            uv pip install -e . --group typecheck
          else
            uv pip install -e . --group typecheck "numpy==$NUMPY"
          fi
          python -c 'import numpy; print("numpy", numpy.__version__)'
      - name: mypy
        run: mypy marketforge

  test:
    # Tests the wheel the build job made, the exact file CD publishes, not
    # an editable install of the checkout: a module or data file missing
    # from the wheel, or a platform where it does not import, fails here,
    # before PyPI, instead of in CD's verify job after it.
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Numba compiles natively and BLAS rounds differently per platform:
          # cover Linux arm64, macOS (arm64) and Windows at both ends of the
          # supported Python range.
          - { os: ubuntu-24.04-arm, python-version: "3.12" }
          - { os: ubuntu-24.04-arm, python-version: "3.14" }
          - { os: macos-15, python-version: "3.12" }
          - { os: macos-15, python-version: "3.14" }
          - { os: windows-2025, python-version: "3.12" }
          - { os: windows-2025, python-version: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the wheel, not the checkout
        run: |
          uv pip install dist/*.whl --group test
          # Delete the source package, so neither pytest nor Python can import
          # it in place of the installed wheel.
          rm -rf marketforge
          python - <<'PY'
          import pathlib
          import marketforge

          origin = pathlib.Path(marketforge.__file__).resolve()
          print("testing", marketforge.__version__, "from", origin)
          assert "site-packages" in origin.parts, f"not the installed wheel: {origin}"
          PY
      - name: Show environment
        run: uv pip list
      - name: pytest
        run: pytest

  coverage:
    # Coverage maps lines to the source tree, so it measures an editable
    # install; the test matrix above covers the wheel.
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: uv pip install -e . --group test
      - name: pytest (with coverage)
        run: |
          pytest --cov --cov-report=xml --cov-report=term
          {
            echo "### Coverage"
            echo '```'
            coverage report --format=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error

  next-python:
    # Early warning for the next CPython (in beta). Deliberately NOT part of
    # "CI OK": a red mark here never blocks a merge. When it is final, move it
    # into the test matrix and add its classifier to pyproject.toml.
    name: Test (py3.15 preview, non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
          cache-suffix: next-python
      - name: Install (binary wheels only, so a missing wheel fails fast)
        run: uv pip install -e . --group test --only-binary ":all:"
      - name: Show environment
        run: |
          python --version
          uv pip list
      - name: pytest
        run: pytest

  min-deps:
    name: Test (lowest supported dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
          cache-suffix: lowest
      - name: Install the declared floors (lowest-direct resolution)
        run: uv pip install -e . --group test --resolution lowest-direct
      - name: Show environment
        run: uv pip list
      - name: pytest
        run: pytest

  reproducibility:
    # The seed contract (docs/adr/0011): every seed must produce the same
    # candles as the latest release, bit for bit, unless MODEL_REVISION is
    # incremented and CHANGELOG.md announces Output changes. Both are fingerprinted in ONE environment (same
    # dependency versions, same CPU), so SIMD differences between runners
    # cannot cause false alarms; each OS is checked against itself.
    name: Seed reproducibility (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Fingerprint the code under test (the wheel CI built)
        run: |
          uv pip install dist/*.whl
          # -I: import the installed package, never the checkout.
          python -I .github/scripts/repro.py capture "$RUNNER_TEMP/head.json"
      - name: Fingerprint the latest release with the same dependencies
        run: |
          baseline="$(python .github/scripts/repro.py baseline)"
          echo "Baseline: marketforge ${baseline}"
          uv pip install --no-deps --reinstall "marketforge==${baseline}"
          python -I .github/scripts/repro.py capture "$RUNNER_TEMP/base.json"
      - name: Compare
        run: python .github/scripts/repro.py compare "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  performance:
    # Speed is part of the contract (docs/adr/0003, 0007): fails when the code
    # under test is more than 15% slower than the latest release on any fixed
    # workload. Like the seed gate, both versions run on this one runner with
    # the same dependencies, interleaved, so the runner's speed cancels out.
    # An intended slowdown is declared with an `Accept-Slowdown: N%` commit
    # trailer (read from the commits since the release, hence fetch-depth 0).
    name: Performance
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the code under test and the latest release, with the same dependencies
        run: |
          baseline="$(python .github/scripts/repro.py baseline)"
          echo "Baseline: marketforge ${baseline}"
          wheel="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv head --python "$DEFAULT_PYTHON"
          uv pip install --python head/bin/python "$wheel"
          # --color never: FORCE_COLOR would put ANSI codes into the file.
          uv pip freeze --color never --python head/bin/python | grep -v '^marketforge' > dependencies.txt
          uv venv base --python "$DEFAULT_PYTHON"
          uv pip install --python base/bin/python -r dependencies.txt
          uv pip install --python base/bin/python --no-deps "marketforge==${baseline}"
      - name: Time both versions, interleaved
        run: >-
          python .github/scripts/perf.py run "$RUNNER_TEMP/perf.json"
          --head "$RUNNER_TEMP/head/bin/python" --base "$RUNNER_TEMP/base/bin/python"
      - name: Compare
        run: python .github/scripts/perf.py compare "$RUNNER_TEMP/perf.json"
      - name: Upload the timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance
          path: ${{ runner.temp }}/perf.json
          retention-days: 30
          if-no-files-found: ignore

  docs-examples:
    # Runs the code blocks of README.md and the website's pages against the
    # wheel CI built, so a renamed option or parameter cannot leave the
    # documentation broken. Blocks too long to run are checked without
    # running (`check=static` after the fence's language).
    name: Documentation examples
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "true"
          cache-dependency-glob: pyproject.toml
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Install the wheel and what the examples import
        run: uv pip install dist/*.whl --group docs
      - name: Check every example
        # -I: import the installed wheel, never the checkout.
        run: python -I .github/scripts/doc_examples.py

  build:
    name: Build & verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          # Never build a published artifact from a restored cache.
          enable-cache: "false"
      - name: Install build tools
        run: uv pip install --group release
      - name: Validate pyproject.toml
        run: validate-pyproject pyproject.toml
      - name: Build sdist, then the wheel from the sdist
        run: |
          # Reproducible archives: timestamps come from the commit.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          uv build --no-cache --out-dir dist
          ls -l dist
      - name: Check distributions
        run: |
          python .github/scripts/release.py check-dist dist
          twine check --strict dist/*
          check-wheel-contents dist/*.whl
      - name: Smoke-test the wheel in a clean environment
        run: |
          expected="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          wheel="$(realpath dist/*.whl)"
          cd "$RUNNER_TEMP"
          uv venv smoke --python "$DEFAULT_PYTHON"
          uv pip install --python smoke "$wheel"
          actual="$(smoke/bin/marketforge --version)"
          echo "$actual"
          [ "$actual" = "marketforge, version $expected" ] || { echo "::error::CLI reports '$actual', expected $expected"; exit 1; }
          smoke/bin/python - <<'PY'
          import importlib.resources
          import marketforge as mf

          assert importlib.resources.files("marketforge").joinpath("py.typed").is_file()
          data = mf.generate(["EURUSD", "BTCUSD"], start="2024-01-02", end="2024-01-04",
                             seed=1, timeframes=["H1"])
          for symbol in ("EURUSD", "BTCUSD"):
              frame = data[symbol]["H1"]
              assert len(frame) > 0, symbol
              assert (frame["high"] >= frame[["open", "close"]].max(axis=1)).all(), symbol
          print("smoke test passed:", {s: len(data[s]["H1"]) for s in data})
          PY
      - name: Generate the SBOM (CycloneDX) of the installed wheel
        # Lists the runtime dependency tree exactly as the smoke environment
        # resolved it. Kept out of dist/: everything there is sent to PyPI.
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p sbom
          # No --output-reproducible: it drops the serialNumber, and
          # actions/attest refuses an SBOM without one.
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --of JSON -o "sbom/marketforge-${version}.cdx.json" \
            "$RUNNER_TEMP/smoke/bin/python"
          # The same checks actions/attest makes in CD, plus completeness.
          python .github/scripts/release.py check-sbom "sbom/marketforge-${version}.cdx.json"
      - name: Third-party licences of the runtime dependencies (policy and texts)
        # The dependency tree of the wheel on Linux (the smoke environment)
        # and as it resolves for macOS and Windows (colorama is Windows only).
        # Fails on a licence the policy (.github/python-license-policy.toml)
        # does not allow, or a dependency without licence text; CD attaches
        # the file to the GitHub release.
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          wheel="$(realpath dist/*.whl)"
          linux="$("$RUNNER_TEMP/smoke/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
          for platform in aarch64-apple-darwin x86_64-pc-windows-msvc; do
            uv pip install --quiet --python-version "$DEFAULT_PYTHON" --python-platform "$platform" \
              --target "$RUNNER_TEMP/licenses-$platform" "$wheel"
          done
          python .github/scripts/licenses.py \
            --path "$linux" \
            --path "$RUNNER_TEMP/licenses-aarch64-apple-darwin" \
            --path "$RUNNER_TEMP/licenses-x86_64-pc-windows-msvc" \
            --platforms "Python ${DEFAULT_PYTHON} on Linux, macOS and Windows" \
            --out "third-party-licenses/marketforge-${version}.third-party-licenses.txt"
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/
          retention-days: 14
          if-no-files-found: error
      - name: Upload third-party licences
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: third-party-licenses/
          retention-days: 14
          if-no-files-found: error

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install pip-audit
        run: uv pip install --group audit
      - name: Audit the runtime dependency tree (oldest and newest Python)
        run: |
          status=0
          for py in 3.12 3.14; do
            uv pip compile pyproject.toml --python-version "$py" --generate-hashes --quiet \
              -o "requirements-$py.txt"
            echo "::group::pip-audit (Python $py resolution)"
            pip-audit --strict --progress-spinner off --require-hashes --disable-pip \
              -r "requirements-$py.txt" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  workflows:
    name: Lint GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install linters
        run: uv pip install --group workflow-lint
      - name: actionlint
        run: actionlint -color
      - name: zizmor (Actions security audit)
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows

  secrets:
    # The project holds no secrets by design (PyPI trusted publishing, no
    # tokens), and GitHub push protection blocks known token formats. This
    # also scans the whole history, and generic patterns push protection
    # does not know: a key that slips into a commit fails CI. gitleaks is
    # built from source at a pinned version through the Go module proxy,
    # whose checksum database verifies the code (no third-party action).
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: v8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install gitleaks
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          "$RUNNER_TEMP/bin/gitleaks" version
      - name: Scan every commit
        # --redact: a finding is reported by file, line and rule, never by value.
        run: '"$RUNNER_TEMP/bin/gitleaks" git --redact --no-banner --verbose .'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  release-readiness:
    # A merge into main releases (cd.yml). Run the release guard before the
    # merge, so a missing version bump, CHANGELOG section or major bump for
    # breaking commits blocks the PR instead of failing CD after the merge.
    name: Release readiness
    if: >-
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          activate-environment: "true"
          enable-cache: "false"
      - name: Install release tools
        run: uv pip install --group release
      - name: Check that merging this releases a valid new version
        run: python .github/scripts/release.py guard

  website:
    name: Website
    # The playground serves the wheel CI built and tested (website/scripts/
    # sync-playground.mjs picks it up from dist/).
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the distributions CI built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.nvmrc
          # No dependency cache: a poisoned cache must never reach the site.
          package-manager-cache: false
      - name: Install (lockfile only)
        working-directory: website
        run: npm ci --no-audit --no-fund
      # Every build (check and build alike) first writes
      # public/third-party-licenses.txt, the licences of every npm package
      # and of the wheels the playground serves, and fails on a licence
      # license-policy.json does not allow, a package without licence text,
      # or licence texts saved for another version of a package.
      - name: Type-check (astro check)
        working-directory: website
        run: npm run check
      - name: Build the site
        working-directory: website
        run: npm run build
      - name: Check internal links
        working-directory: website
        run: npm run check-links
      # After the build: they also check the wheels it put in public/.
      - name: Test the build scripts
        working-directory: website
        run: npm test
      # Pyodide's wheels are downloaded by the build and checked against the
      # hashes of its lock file; this runs the built playground under Node.
      - name: Run the playground in Pyodide
        working-directory: website
        run: npm run test-playground
      # On main, CD deploys exactly this artifact to GitHub Pages.
      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - coverage
      - min-deps
      - reproducibility
      - performance
      - docs-examples
      - build
      - audit
      - secrets
      - workflows
      - dependency-review
      - release-readiness
      - website
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed (or be skipped)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::At least one CI job failed or was cancelled"
            exit 1
          fi
