name: Engine round trips

# `marketforge export` writes datasets in the file layouts of freqtrade and
# LEAN. This loads an export into each engine and runs a trivial strategy, so
# a change of format on either side shows up. Both engines need the network
# (freqtrade loads its exchange's market list, LEAN is a Docker image), so it
# runs weekly, on demand, and on pull requests that touch the exporter, never
# on every change. A failing scheduled run opens an issue (scheduled-alerts.yml).

on:
  pull_request:
    paths:
      - marketforge/output/engines.py
      - marketforge/api/exporting.py
      - .github/scripts/engines/**
      - .github/workflows/engines.yml
  schedule:
    - cron: "17 7 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engines-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON: "3.13"

jobs:
  freqtrade:
    name: freqtrade backtest of an export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON }}
          activate-environment: "true"
      - name: Install MarketForge and freqtrade
        run: uv pip install . freqtrade
      - name: Export and backtest
        working-directory: ${{ runner.temp }}
        run: python -I "$GITHUB_WORKSPACE/.github/scripts/engines/freqtrade_roundtrip.py"

  lean:
    name: LEAN algorithm on an export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # LEAN's engine as QuantConnect publishes it; the weekly run catches a
      # release that reads data differently.
      IMAGE: quantconnect/lean:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON }}
          activate-environment: "true"
      - name: Install MarketForge
        run: uv pip install .
      - name: Choose the work folder
        run: echo "WORK=$RUNNER_TEMP/lean" >> "$GITHUB_ENV"
      - name: Export a dataset and write the algorithm
        run: python -I .github/scripts/engines/lean_roundtrip.py prepare "$WORK"
      - name: Pull LEAN
        run: docker pull "$IMAGE"
      - name: Add LEAN's market hours and symbol properties to the data folder
        run: |
          id=$(docker create "$IMAGE")
          docker cp "$id:/Lean/Data/market-hours" "$WORK/data/"
          docker cp "$id:/Lean/Data/symbol-properties" "$WORK/data/"
          docker rm "$id"
      - name: Run the algorithm
        run: |
          docker run --rm \
            -v "$WORK/data:/Data" -v "$WORK/algorithm:/Algorithm" -v "$WORK/results:/Results" \
            "$IMAGE" \
            --data-folder /Data/ \
            --algorithm-language Python \
            --algorithm-type-name Main \
            --algorithm-location /Algorithm/main.py \
            --results-destination-folder /Results \
            --close-automatically true \
            | tee "$WORK/results/console-log.txt"
      - name: Check LEAN read every market
        run: python -I .github/scripts/engines/lean_roundtrip.py check "$WORK"
      - name: Upload LEAN's results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lean-results
          path: ${{ runner.temp }}/lean/results
          retention-days: 14
          if-no-files-found: ignore
